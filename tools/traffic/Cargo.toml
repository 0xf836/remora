[package]
name = "remora-traffic"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.99"

[dependencies]
remora = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# Pinned packet-padding correction; see docs/adr/0016-quiche-minimum-payload.md.
[patch.crates-io]
quiche = { git = "https://github.com/0xf836/quiche", rev = "154ce1995f23efa434e72dac269f707145be2015" }

# Keep the other upstream workspace crates on their existing registry pins.
[patch."https://github.com/0xf836/quiche"]
octets = { version = "=0.3.7" }
